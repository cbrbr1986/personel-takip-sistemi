name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify secure Android source
        run: |
          grep -q 'fun getSecurityVersion(): Int = 3' app/src/main/java/com/coskun/pdkspersonel/MainActivity.kt
          grep -q 'KVKK-PDKS-2026-08-12-v1' app/src/main/java/com/coskun/pdkspersonel/MainActivity.kt
          grep -q 'versionCode = 11' app/build.gradle.kts

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PDKS-Personel-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
