<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PDKS Kurumsal Yönetici Girişi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1c1e21;
        }
        .login-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        .login-header {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #3498db;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #34495e;
        }
        .alert-box {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
        .alert-error {
            background: #fce4e4;
            color: #cc0000;
            border: 1px solid #f9b3b3;
        }
        .alert-success {
            background: #e6f9ed;
            color: #1e7e34;
            border: 1px solid #b3f0c2;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            PDKS Kurumsal Panel Girişi
        </div>
        
        <form id="adminLoginForm" onsubmit="sistemeGirisYap(event)">
            <div class="input-group">
                <label for="username">Yönetici Kullanıcı Adı</label>
                <input type="text" id="username" required 
                       placeholder="Kullanıcı adınızı girin">
            </div>
            
            <div class="input-group">
                <label for="password">Yönetici Giriş Şifresi</label>
                <input type="password" id="password" required 
                       placeholder="Şifrenizi girin">
            </div>

            <!-- GİZLİ GÜVENLİK MODELİ PARAMETRELERİ -->
            <!-- İleride fingerprint/cihaz verilerini sunucuya -->
            <!-- iletmek isterseniz bu gizli girdileri kullanabilirsiniz -->
            <input type="hidden" id="kiosk_fingerprint" value="">
            <input type="hidden" id="kiosk_location_status" value="OK">

            <button type="submit" class="btn-login">
                Güvenli Giriş Yap
            </button>
        </form>

        <div id="alertMessage" class="alert-box"></div>
    </div>
    <script>
        // CİHAZ BARKOD / FINGERPRINT ÜRETİCİSİ
        // İleride cihaz kontrolünü aktif etmek için tırnakları açın
        function cihazKimligiUret() {
            // const cihazHash = btoa(navigator.userAgent + 
            //     navigator.language + screen.colorDepth);
            // document.getElementById('kiosk_fingerprint').value = cihazHash;
            console.log("Cihaz izleme katmanı hazır durumda.");
        }

        // Sayfa yüklendiğinde arka planda cihaz kimliğini hazırla
        cihazKimligiUret();

        async function sistemeGirisYap(event) {
            event.preventDefault(); // Sayfa yenilenmesini engelle
            
            const kAdi = document.getElementById('username').value;
            const sifre = document.getElementById('password').value;
            const uyarKutusu = document.getElementById('alertMessage');

            // Form verisi formatı oluşturma (FastAPI Form(...) beklediği için)
            const formData = new FormData();
            formData.append('kullanici_adi', kAdi);
            formData.append('sifre', sifre);

            try {
                uyarKutusu.style.display = "none";
                
                // main.py içindeki API ucuna istek gönderiliyor
                let r = await fetch(window.location.origin + '/api/admin-login', {
                    method: 'POST',
                    body: formData
                });
                
                let res = await r.json();

                if (res.status === "success") {
                    uyarKutusu.className = "alert-box alert-success";
                    uyarKutusu.innerText = "Giriş Başarılı! Yönlendiriliyorsunuz...";
                    uyarKutusu.style.display = "block";
                    
                    // Giriş başarılı olunca gelişmiş yönetici paneline yönlendir
                    setTimeout(() => {
                        window.location.href = "/yonetici-paneli";
                    }, 1500);
                } else {
                    uyarKutusu.className = "alert-box alert-error";
                    uyarKutusu.innerText = res.message || "Hatalı kimlik bilgisi!";
                    uyarKutusu.style.display = "block";
                }
            } catch (e) {
                console.error("Giriş hatası:", e);
                uyarKutusu.className = "alert-box alert-error";
                uyarKutusu.innerText = "Sunucu bağlantı hatası oluştu!";
                uyarKutusu.style.display = "block";
            }
        }
    </script>
</body>
</html>
