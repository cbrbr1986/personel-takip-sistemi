<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDKS Personel Kurulumu</title>
    <style>
        *{box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#eef2f6;margin:0;padding:20px;color:#243447}.box{max-width:430px;margin:20px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.1)}h2{text-align:center;margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:7px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:7px;margin-top:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:#3498db}.green{background:#27ae60}.orange{background:#e67e22}.gray{background:#7f8c8d}.status{margin-top:16px;padding:12px;border-radius:7px;background:#f5f7f9;text-align:center;font-weight:700}.info{margin-top:15px;padding:12px;border-left:4px solid #3498db;background:#f8fafc;font-size:13px;line-height:1.6}#reader{display:none;margin-top:15px;background:#111;border-radius:9px;overflow:hidden}video{display:block;width:100%;max-height:420px}.hidden{display:none}.success{color:#16883e}.error{color:#c0392b}.warning{color:#d35400}
    </style>
</head>
<body>
<div class="box">
    <h2>PDKS Personel Giriş Sistemi</h2>

    <section id="kurulum-alani">
        <p>İlk kullanımda sicil numaranızla telefonunuzu hesabınıza bağlayın.</p>
        <label for="sicil-no">Sicil Numarası</label>
        <input id="sicil-no" autocomplete="off" placeholder="Örn: 10025">
        <button onclick="kurulumYap()">Telefonu Personel Hesabına Bağla</button>
    </section>

    <section id="giris-alani" class="hidden">
        <div class="info">
            <b>Personel:</b> <span id="personel-adi">-</span><br>
            <b>Şube:</b> <span id="personel-sube">-</span><br>
            <b>GPS:</b> <span id="gps-bilgi">Henüz alınmadı</span>
        </div>
        <button class="green" onclick="kamerayiAc()">Kamerayı Aç ve QR Okut</button>
        <div id="reader"><video id="video" playsinline autoplay muted></video></div>
        <div id="manuel-alan" class="hidden">
            <label for="manuel-qr">QR kod numarası</label>
            <input id="manuel-qr" inputmode="numeric" placeholder="QR kodunu girin">
            <button class="orange" onclick="manuelQrGonder()">Kodu Doğrula</button>
        </div>
    </section>

    <div id="durum" class="status">Kurulum bekleniyor.</div>
</div>

<script>
let kameraAkisi = null;
let taramaDongusu = null;
let istekGonderiliyor = false;
let sonKonum = null;

function cihazIdGetir() {
    let id = localStorage.getItem("pdks_cihaz_id_v2");
    if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : "pdks-" + Date.now() + "-" + Math.random().toString(36).slice(2));
        localStorage.setItem("pdks_cihaz_id_v2", id);
    }
    return id;
}

function durumYaz(metin, tur="") {
    const kutu = document.getElementById("durum");
    kutu.textContent = metin;
    kutu.className = "status " + tur;
}

function kurulumEkraniniGuncelle() {
    const token = localStorage.getItem("pdks_cihaz_token");
    if (token && localStorage.getItem("pdks_son_islem_basarili") === "1") {
        window.location.replace("/personel-sicil");
        return;
    }
    document.getElementById("kurulum-alani").classList.toggle("hidden", !!token);
    document.getElementById("giris-alani").classList.toggle("hidden", !token);
    if (token) {
        document.getElementById("personel-adi").textContent = localStorage.getItem("pdks_personel_adi") || "Kayıtlı personel";
        document.getElementById("personel-sube").textContent = localStorage.getItem("pdks_personel_sube") || "-";
        durumYaz("Cihaz hazır. QR okutabilirsiniz.", "success");
    }
}


async function kurulumYap() {
    const sicilNo = document.getElementById("sicil-no").value.trim();
    if (!sicilNo) return durumYaz("Sicil numaranızı girin.", "error");
    durumYaz("Personel doğrulanıyor...");
    const form = new FormData();
    form.append("sicil_no", sicilNo);
    form.append("cihaz_id", cihazIdGetir());
    try {
        const cevap = await fetch("/api/personel/kurulum", {method:"POST", body:form});
        const veri = await cevap.json();
        if (veri.status !== "success") return durumYaz(veri.message || "Kurulum reddedildi.", "error");
        localStorage.setItem("pdks_cihaz_token", veri.cihaz_token);
        localStorage.setItem("pdks_personel_adi", veri.personel);
        localStorage.setItem("pdks_personel_sube", veri.sube);
        kurulumEkraniniGuncelle();
    } catch (e) {
        durumYaz("Sunucu bağlantısı kurulamadı.", "error");
    }
}

function konumAl() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("Konum desteği yok."));
        navigator.geolocation.getCurrentPosition(p => {
            sonKonum = p.coords;
            document.getElementById("gps-bilgi").textContent = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)}m)`;
            resolve(p.coords);
        }, () => reject(new Error("Konum izni verilmedi.")), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
    });
}

async function kamerayiAc() {
    if (istekGonderiliyor) return;
    try {
        durumYaz("GPS konumu alınıyor...");
        await konumAl();
        if (!("BarcodeDetector" in window)) {
            document.getElementById("manuel-alan").classList.remove("hidden");
            return durumYaz("Tarayıcı QR kamerayı desteklemiyor. Kodu elle girin.", "warning");
        }
        const detector = new BarcodeDetector({formats:["qr_code"]});
        kameraAkisi = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
        const video = document.getElementById("video");
        video.srcObject = kameraAkisi;
        document.getElementById("reader").style.display = "block";
        durumYaz("Kamera aktif. QR kodu çerçeveye gösterin.");
        taramaDongusu = setInterval(async () => {
            if (istekGonderiliyor || video.readyState < 2) return;
            try {
                const kodlar = await detector.detect(video);
                if (kodlar.length && kodlar[0].rawValue) {
                    kameraKapat();
                    await sunucuyaGonder(kodlar[0].rawValue);
                }
            } catch (e) {}
        }, 350);
    } catch (e) {
        durumYaz(e.message || "Kamera başlatılamadı.", "error");
    }
}

function kameraKapat() {
    if (taramaDongusu) clearInterval(taramaDongusu);
    taramaDongusu = null;
    if (kameraAkisi) kameraAkisi.getTracks().forEach(t => t.stop());
    kameraAkisi = null;
    document.getElementById("reader").style.display = "none";
}

async function manuelQrGonder() {
    const kod = document.getElementById("manuel-qr").value.trim();
    if (!kod) return durumYaz("QR kodunu girin.", "error");
    try { await konumAl(); await sunucuyaGonder(kod); }
    catch (e) { durumYaz(e.message, "error"); }
}

async function sunucuyaGonder(qrMetni) {
    if (!sonKonum || istekGonderiliyor) return;
    istekGonderiliyor = true;
    durumYaz("İşlem doğrulanıyor...");
    const form = new FormData();
    form.append("p_enlem", sonKonum.latitude);
    form.append("p_boylam", sonKonum.longitude);
    form.append("p_sapma", sonKonum.accuracy);
    form.append("cihaz_id", cihazIdGetir());
    form.append("cihaz_token", localStorage.getItem("pdks_cihaz_token") || "");
    form.append("zaman_damgasi", Math.floor(Date.now()/1000));
    form.append("okunan_qr_metni", qrMetni);
    try {
        const cevap = await fetch("/api/verify-camera-photo", {method:"POST", body:form});
        const veri = await cevap.json();
        if (veri.status !== "success" && (veri.message || "").includes("Cihaz doğrulanamadı")) {
            ["pdks_cihaz_token", "pdks_personel_adi", "pdks_personel_sube"].forEach(k => localStorage.removeItem(k));
            kurulumEkraniniGuncelle();
            durumYaz("Cihaz kaydı geçersiz. Yöneticiniz cihaz bağlantısını sıfırladıktan sonra sicil numaranızla yeniden kurulum yapın.", "error");
            return;
        }
        durumYaz((veri.status === "success" ? "✅ " : "❌ ") + (veri.message || "İşlem tamamlanamadı."), veri.status === "success" ? "success" : "error");
        if (veri.status === "success") {
            localStorage.setItem("pdks_son_islem_basarili", "1");
            setTimeout(() => window.location.href = "/personel-sicil", 700);
        }
    } catch (e) {
        durumYaz("Sunucu bağlantı hatası.", "error");
    } finally {
        istekGonderiliyor = false;
    }
}

window.addEventListener("beforeunload", kameraKapat);
kurulumEkraniniGuncelle();
</script>
</body>
</html>
