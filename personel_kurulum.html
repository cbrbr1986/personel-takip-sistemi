<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDKS Personel</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(155deg,#eaf1f8,#f7f9fc);margin:0;min-height:100vh;color:#203449}.ust{height:58px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:#173b66;color:#fff}.logo{font-weight:850}.ust button{width:auto;margin:0;padding:9px 12px;background:#ffffff20}.sayfa{width:min(100%,450px);margin:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}.box{background:#fff;padding:25px 21px;border-radius:22px;box-shadow:0 12px 36px #173b6618}.simge{width:64px;height:64px;margin:0 auto 12px;display:grid;place-items:center;border-radius:20px;background:#e8f2fb;font-size:30px}h1{text-align:center;font-size:23px;margin:0 0 8px}.aciklama{text-align:center;color:#687b8e;font-size:14px;line-height:1.5;margin-bottom:22px}label{display:block;font-weight:750;margin:14px 0 7px}input{width:100%;padding:15px;border:1px solid #cdd8e3;border-radius:12px;font-size:17px;outline:none}input:focus{border-color:#2878b8;box-shadow:0 0 0 3px #2878b820}button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:14px;font-size:16px;font-weight:800;color:#fff;background:#2878b8}.green{background:#188b53}.gray{background:#66788a}.hidden{display:none!important}.status{margin-top:17px;padding:12px;border-radius:11px;background:#f2f5f8;text-align:center;font-weight:650;font-size:14px}.success{color:#117941;background:#e9f8ef}.error{color:#b52d27;background:#fff0ef}.bilgi{padding:13px;border-radius:12px;background:#f2f7fb;line-height:1.65;font-size:14px}.adim{font-size:12px;font-weight:850;color:#2878b8;text-transform:uppercase;letter-spacing:.7px}.pin{letter-spacing:8px;text-align:center;font-size:22px}#reader{display:none;margin-top:15px;background:#111;border-radius:14px;overflow:hidden}video{display:block;width:100%;max-height:420px}
</style>
</head>
<body>
<header class="ust"><div class="logo">PDKS PERSONEL</div><button onclick="uygulamayiKapat()">Kapat ✕</button></header>
<main class="sayfa"><div class="box">
<div class="simge">👤</div><h1 id="baslik">Personel Girişi</h1><div id="aciklama" class="aciklama">Devam etmek için sicil numaranızı girin.</div>
<section id="sicil-adimi"><div class="adim">1. Adım</div><label>Sicil Numarası</label><input id="sicil-no" autocomplete="username" inputmode="numeric" placeholder="Sicil numaranız"><button onclick="sicilKontrolEt()">Devam Et</button></section>
<section id="pin-adimi" class="hidden"><div class="adim">2. Adım</div><div class="bilgi"><b id="personel-karsilama">Personel</b></div><label id="pin-label">6 Haneli Şifre</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"><div id="pin-tekrar-alani" class="hidden"><label>Şifre Tekrar</label><input id="pin-tekrar" class="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div><button id="giris-butonu" class="green" onclick="girisYap()">Giriş Yap</button><button class="gray" onclick="sicileDon()">Geri Dön</button></section>
<section id="islem-alani" class="hidden"><div class="bilgi"><b id="personel-adi">-</b><br>Şube: <span id="personel-sube">-</span><br>GPS: <span id="gps-bilgi">Hazır değil</span></div><button class="green" onclick="qrIsleminiBaslat()">Kare Kodu Okut</button><div id="reader"><video id="video" playsinline autoplay muted></video></div><button class="gray" onclick="oturumuKapat()">Oturumu Kapat</button></section>
<div id="durum" class="status">Giriş bekleniyor.</div>
</div></main>
<script>
let kameraAkisi=null,taramaDongusu=null,istekGonderiliyor=false,sonKonum=null,pinOlusturulacak=false,nativeKonumBekleyici=null;
function cihazIdGetir(){let id=localStorage.getItem('pdks_cihaz_id_v2');if(!id){id=crypto.randomUUID?crypto.randomUUID():'pdks-'+Date.now();localStorage.setItem('pdks_cihaz_id_v2',id)}return id}
function durumYaz(metin,tur=''){const d=document.getElementById('durum');d.textContent=metin;d.className='status '+tur}
function goster(id){['sicil-adimi','pin-adimi','islem-alani'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
async function sicilKontrolEt(){const sicil=document.getElementById('sicil-no').value.trim();if(!sicil)return durumYaz('Sicil numaranızı girin.','error');durumYaz('Personel kaydı kontrol ediliyor...');const f=new FormData();f.append('sicil_no',sicil);f.append('cihaz_id',cihazIdGetir());try{const r=await fetch('/api/personel/kurulum-kontrol',{method:'POST',body:f}),v=await r.json();if(v.status!=='success')return durumYaz(v.message||'Giriş yapılamadı.','error');pinOlusturulacak=!v.pin_var;document.getElementById('personel-karsilama').textContent=v.personel;document.getElementById('pin-tekrar-alani').classList.toggle('hidden',!pinOlusturulacak);document.getElementById('pin-label').textContent=pinOlusturulacak?'Yeni 6 Haneli Şifre':'6 Haneli Şifre';document.getElementById('giris-butonu').textContent=pinOlusturulacak?'Şifre Oluştur ve Giriş Yap':'Giriş Yap';goster('pin-adimi');durumYaz(pinOlusturulacak?'İlk kullanım şifrenizi oluşturun.':'Şifrenizi girin.')}catch(e){durumYaz('Sunucu bağlantısı kurulamadı.','error')}}
async function girisYap(){const pin=document.getElementById('pin').value,pin2=document.getElementById('pin-tekrar').value;if(!/^\d{6}$/.test(pin))return durumYaz('Şifre 6 rakam olmalıdır.','error');if(pinOlusturulacak&&pin!==pin2)return durumYaz('Şifreler eşleşmiyor.','error');const f=new FormData();f.append('sicil_no',document.getElementById('sicil-no').value.trim());f.append('cihaz_id',cihazIdGetir());f.append('pin',pin);f.append('pin_tekrar',pin2);durumYaz('Giriş yapılıyor...');try{const r=await fetch('/api/personel/kurulum',{method:'POST',body:f}),v=await r.json();if(v.status!=='success')return durumYaz(v.message||'Giriş reddedildi.','error');localStorage.setItem('pdks_cihaz_token',v.cihaz_token);localStorage.setItem('pdks_personel_adi',v.personel);localStorage.setItem('pdks_personel_sube',v.sube);sessionStorage.setItem('pdks_oturum_acik','1');sessionStorage.removeItem('pdks_islem_modu');location.replace('/personel-sicil')}catch(e){durumYaz('Sunucu bağlantısı kurulamadı.','error')}}
function islemEkrani(){goster('islem-alani');document.getElementById('personel-adi').textContent=localStorage.getItem('pdks_personel_adi')||'Personel';document.getElementById('personel-sube').textContent=localStorage.getItem('pdks_personel_sube')||'-';durumYaz('Giriş başarılı. Kare kodu okutabilirsiniz.','success')}
function sicileDon(){document.getElementById('pin').value='';document.getElementById('pin-tekrar').value='';goster('sicil-adimi');durumYaz('Sicil numaranızı girin.')}
function oturumuKapat(){kameraKapat();sessionStorage.removeItem('pdks_oturum_acik');localStorage.removeItem('pdks_son_islem_basarili');sicileDon()}
function uygulamayiKapat(){if(window.Android&&Android.closeApp)Android.closeApp();else window.close()}
function konumAl(){return new Promise((ok,hata)=>{if(window.Android&&Android.requestSecureLocation){nativeKonumBekleyici={ok,hata};Android.requestSecureLocation();return}if(!navigator.geolocation)return hata(new Error('Konum desteği yok.'));navigator.geolocation.getCurrentPosition(p=>{sonKonum={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,ageMs:0,isMock:false,source:'web'};document.getElementById('gps-bilgi').textContent=`${sonKonum.latitude.toFixed(5)}, ${sonKonum.longitude.toFixed(5)} (±${Math.round(sonKonum.accuracy)}m)`;ok(sonKonum)},()=>hata(new Error('Konum izni verilmedi.')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function nativeKonumSonucu(k){sonKonum=k;document.getElementById('gps-bilgi').textContent=`${Number(k.latitude).toFixed(5)}, ${Number(k.longitude).toFixed(5)} (±${Math.round(k.accuracy)}m)`+(k.isMock?' — SAHTE KONUM':'');if(nativeKonumBekleyici){nativeKonumBekleyici.ok(k);nativeKonumBekleyici=null}}
function nativeKonumHatasi(mesaj){if(nativeKonumBekleyici){nativeKonumBekleyici.hata(new Error(mesaj));nativeKonumBekleyici=null}}
async function qrIsleminiBaslat(){try{durumYaz('GPS konumu alınıyor...');await konumAl();if(sonKonum&&sonKonum.isMock){durumYaz('❌ Sahte konum tespit edildi. İşlem reddedildi.','error');return}if(window.Android&&Android.startQrScanner){Android.startQrScanner();return}await webKamerasiniAc()}catch(e){durumYaz(e.message||'İşlem başlatılamadı.','error')}}
async function webKamerasiniAc(){if(!('BarcodeDetector'in window))return durumYaz('QR tarayıcı bu cihazda desteklenmiyor.','error');const detector=new BarcodeDetector({formats:['qr_code']});kameraAkisi=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.getElementById('video');video.srcObject=kameraAkisi;document.getElementById('reader').style.display='block';taramaDongusu=setInterval(async()=>{if(istekGonderiliyor||video.readyState<2)return;const kodlar=await detector.detect(video);if(kodlar.length){kameraKapat();sunucuyaGonder(kodlar[0].rawValue)}},350)}
function kameraKapat(){if(taramaDongusu)clearInterval(taramaDongusu);taramaDongusu=null;if(kameraAkisi)kameraAkisi.getTracks().forEach(t=>t.stop());kameraAkisi=null;document.getElementById('reader').style.display='none'}
async function nativeQrSonucu(kod){if(!sonKonum)await konumAl();await sunucuyaGonder(kod)}
async function sunucuyaGonder(qr){if(!sonKonum||istekGonderiliyor)return;istekGonderiliyor=true;durumYaz('Giriş/çıkış doğrulanıyor...');const f=new FormData();f.append('p_enlem',sonKonum.latitude);f.append('p_boylam',sonKonum.longitude);f.append('p_sapma',sonKonum.accuracy);f.append('konum_sahte',sonKonum.isMock?'1':'0');f.append('konum_yasi_ms',sonKonum.ageMs||0);f.append('konum_kaynagi',sonKonum.source||'web');f.append('cihaz_id',cihazIdGetir());f.append('cihaz_token',localStorage.getItem('pdks_cihaz_token')||'');f.append('zaman_damgasi',Math.floor(Date.now()/1000));f.append('okunan_qr_metni',qr);try{const r=await fetch('/api/verify-camera-photo',{method:'POST',body:f}),v=await r.json();durumYaz((v.status==='success'?'✅ ':'❌ ')+(v.message||'İşlem tamamlanamadı.'),v.status==='success'?'success':'error');if(v.status==='success'){localStorage.setItem('pdks_son_islem_basarili','1');setTimeout(()=>location.href='/personel-sicil',650)}}catch(e){const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16),q=JSON.parse(localStorage.getItem('pdks_bekleyen_talepler')||'[]');q.push({tur:'İNTERNET YOKTU',zaman:z,aciklama:`QR çevrimdışı okutuldu. GPS: ${sonKonum.latitude}, ${sonKonum.longitude}; sapma ±${Math.round(sonKonum.accuracy)} m. Amir onayı bekleniyor.`});localStorage.setItem('pdks_bekleyen_talepler',JSON.stringify(q));durumYaz('İnternet yok. İşlem GPS ve saat bilgisiyle kaydedildi; amir onayına gönderilecek.','success');setTimeout(()=>location.href='/personel-sicil',1200)}finally{istekGonderiliyor=false}}
window.addEventListener('beforeunload',kameraKapat);if(sessionStorage.getItem('pdks_oturum_acik')==='1'&&localStorage.getItem('pdks_cihaz_token')){if(sessionStorage.getItem('pdks_islem_modu')==='1')islemEkrani();else location.replace('/personel-sicil')}
</script></body></html>
