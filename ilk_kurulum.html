<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDKS İlk Kurulum</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eef3f8;font-family:Segoe UI,sans-serif;color:#203247}.kart{max-width:620px;margin:20px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 30px #173b6620}h1{margin-top:0;color:#173b66}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tam{grid-column:1/-1}label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #ccd6e0;border-radius:8px;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#2476b7;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.bilgi{background:#edf7ff;padding:12px;border-left:4px solid #2476b7;border-radius:7px;margin-bottom:18px}.durum{margin-top:14px;text-align:center;font-weight:700}.hata{color:#c0392b}.basari{color:#18863d}@media(max-width:600px){.grid{grid-template-columns:1fr}.tam{grid-column:auto}}</style></head><body><main class="kart"><h1>PDKS Firma Kurulumu</h1><div class="bilgi">Bu ekran yalnızca ilk kullanımda açılır. Önce firma ve ilk yönetici hesabını oluşturun; şube ve personelleri daha sonra panelden ekleyebilirsiniz.</div><form id="form"><div class="grid"><div class="tam"><label>Firma Adı *</label><input name="firma_adi" required></div><div><label>Vergi No</label><input name="vergi_no"></div><div><label>Firma Telefonu</label><input name="telefon"></div><div class="tam"><label>Firma E-postası</label><input name="eposta" type="email"></div><div class="tam"><label>Yönetici Ad Soyad *</label><input name="ad_soyad" required></div><div><label>Kullanıcı Adı *</label><input name="kullanici_adi" required autocomplete="username"></div><div><label>Parola * (en az 8 karakter)</label><input name="sifre" type="password" minlength="8" required autocomplete="new-password"></div><div class="tam"><label>Parola Tekrar *</label><input name="sifre_tekrar" type="password" minlength="8" required autocomplete="new-password"></div><div class="tam"><button>Kurulumu Tamamla</button></div></div></form><div id="durum" class="durum"></div></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const d=document.getElementById('durum');d.textContent='Kurulum yapılıyor...';d.className='durum';try{const r=await fetch('/api/ilk-kurulum',{method:'POST',body:new FormData(e.target)});const v=await r.json();d.textContent=v.message||'İşlem tamamlandı.';d.className='durum '+(v.status==='success'?'basari':'hata');if(v.status==='success')setTimeout(()=>location.href='/yonetici-paneli',900)}catch(x){d.textContent='Sunucu bağlantısı kurulamadı.';d.className='durum hata'}});</script></body></html>
